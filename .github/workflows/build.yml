name: Build IPA

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: false
        
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'
        
    - name: Install dependencies
      run: |
        brew install ldid
        brew install libtool
        brew install automake
        
    - name: Install theos
      run: |
        export THEOS=$HOME/theos
        sudo mkdir -p /opt/theos
        sudo chown $(whoami) /opt/theos
        git clone --recursive --depth 1 https://github.com/theos/theos.git /opt/theos
        echo "THEOS=/opt/theos" >> $GITHUB_ENV
        
    - name: Build BaseBin
      run: |
        export IS_IOS_SDK_OVERRIDE=1
        export SYSROOT=$(xcrun --sdk iphoneos --show-sdk-path)
        cd Dopamine/BaseBin && make
        
    - name: Build Application IPA
      run: cd Dopamine/Application && make
        
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: Dopamine-Extended
        path: Dopamine/Application/Dopamine.ipa
        retention-days: 30
        
    - name: Create Release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.run_number }}
        name: Dopamine Extended v${{ github.run_number }}
        body: |
          ## Dopamine Extended
          
          ClearSword exploit for iOS 18.7.3 on A12
          
          ### Supported Devices
          - iPhone XS (A12)
          - iPhone XR (A12)
          
          ### Supported iOS Versions
          - iOS 15.0 - 26.0.1
          
          ### Installation
          1. Download Dopamine.ipa
          2. Sideload with AltStore/Sideloadly
          3. Open Dopamine and tap Jailbreak
        files: Dopamine/Application/Dopamine.ipa
        draft: false
        prerelease: false
