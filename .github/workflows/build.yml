name: Build IPA

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: false
        
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.2'
        
    - name: Install dependencies
      run: |
        brew install libtool
        brew install automake
        brew install libarchive
        brew install openssl
        brew install make

    - name: Install Procursus
      uses: dhinakg/procursus-action@main
      with:
        packages: ldid findutils sed coreutils make
        
    - name: Build and Install trustcache
      run: |
        set -x
        git clone https://github.com/CRKatri/trustcache /tmp/trustcache
        cd /tmp/trustcache
        export CFLAGS="$CFLAGS -I$(brew --prefix openssl)/include -arch arm64"
        export LDFLAGS="$LDFLAGS -L$(brew --prefix openssl)/lib -arch arm64"
        gmake -j$(sysctl -n hw.logicalcpu) OPENSSL=1
        sudo cp trustcache /usr/local/bin/
        trustcache --help >/dev/null 2>&1 || true
        
    - name: Install theos
      run: |
        export THEOS=$HOME/theos
        sudo mkdir -p /opt/theos
        sudo chown $(whoami) /opt/theos
        git clone --recursive --depth 1 https://github.com/theos/theos.git /opt/theos
        echo "THEOS=/opt/theos" >> $GITHUB_ENV
        
    - name: Build BaseBin
      id: basebin
      continue-on-error: true
      run: |
        export IS_IOS_SDK_OVERRIDE=1
        export SYSROOT=$(xcrun --sdk iphoneos --show-sdk-path)
        { cd Dopamine/BaseBin && make; } 2>&1 | tee /tmp/basebin_build.log
        exit ${PIPESTATUS[0]}

    - name: Publish BaseBin log (always)
      if: always()
      run: |
        mkdir -p _ci_logs
        cp -f /tmp/basebin_build.log _ci_logs/basebin_build.log 2>/dev/null || echo "no basebin log (maybe step failed early)"
        git config user.name "CI Bot"
        git config user.email "ci@example.com"
        git stash -u 2>/dev/null || true
        git checkout -B ci-logs 2>/dev/null || git checkout ci-logs 2>/dev/null || true
        mkdir -p _ci_logs
        cp -f /tmp/basebin_build.log _ci_logs/basebin_build.log 2>/dev/null || true
        cp -f /tmp/app_build.log _ci_logs/app_build.log 2>/dev/null || true
        echo "${{ github.run_number }}/${{ github.run_attempt }}" > _ci_logs/meta.txt
        git add _ci_logs
        git commit -m "ci-logs run ${{ github.run_number }} attempt ${{ github.run_attempt }}" 2>/dev/null || echo "nothing to commit"
        git push -f origin ci-logs 2>&1 | tail -5

    - name: Check BaseBin result
      if: steps.basebin.outcome == 'failure'
      run: exit 1
        
    - name: Build Application IPA
      id: app
      continue-on-error: true
      run: |
        set -e
        command -v dpkg-deb >/dev/null 2>&1 || brew install dpkg
        { make -C Dopamine/Packages; } 2>&1 | tee /tmp/packages_build.log
        make_pkgs_rc=${PIPESTATUS[0]}
        if [ $make_pkgs_rc -ne 0 ]; then
          cp /tmp/packages_build.log /tmp/app_build.log
          exit $make_pkgs_rc
        fi
        ( cd Dopamine/Application/Dopamine/Resources && bash ./download_bootstraps.sh ) 2>&1 | tee /tmp/bootstrap_build.log
        bs_rc=${PIPESTATUS[0]}
        if [ $bs_rc -ne 0 ]; then
          cp /tmp/bootstrap_build.log /tmp/app_build.log
          exit $bs_rc
        fi
        { cd Dopamine/Application && make; } 2>&1 | tee /tmp/app_build.log
        exit ${PIPESTATUS[0]}

    - name: Publish Application log (if app failed)
      if: steps.app.outcome == 'failure'
      run: |
        git config user.name "CI Bot"
        git config user.email "ci@example.com"
        git checkout ci-logs 2>/dev/null || git checkout -B ci-logs 2>/dev/null || true
        mkdir -p _ci_logs
        cp -f /tmp/app_build.log _ci_logs/app_build.log
        echo "${{ github.run_number }}/${{ github.run_attempt }}" > _ci_logs/meta.txt
        git add _ci_logs
        git commit -m "app-log run ${{ github.run_number }}" 2>/dev/null || echo "nothing to commit"
        git push -f origin ci-logs 2>&1 | tail -5

    - name: Check Application result
      if: steps.app.outcome == 'failure'
      run: exit 1
        
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: Dopamine-Extended
        path: Dopamine/Application/Dopamine.ipa
        retention-days: 30
        
    - name: Create Release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.run_number }}
        name: Dopamine Extended v${{ github.run_number }}
        body: |
          ## Dopamine Extended
          
          ClearSword exploit for iOS 18.7.3 on A12
          
          ### Supported Devices
          - iPhone XS (A12)
          - iPhone XR (A12)
          
          ### Supported iOS Versions
          - iOS 15.0 - 26.0.1
          
          ### Installation
          1. Download Dopamine.ipa
          2. Sideload with AltStore/Sideloadly
          3. Open Dopamine and tap Jailbreak
        files: Dopamine/Application/Dopamine.ipa
        draft: false
        prerelease: false
