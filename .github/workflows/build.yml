name: Create Release

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
        
    - name: Create tag
      run: git tag v${{ github.run_number }}
      
    - name: Push tag
      run: git push origin v${{ github.run_number }}
        
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.run_number }}
        name: Dopamine Extended v${{ github.run_number }}
        body: |
          ## Dopamine Extended
          
          ClearSword exploit integration for iOS 18.7.3
          
          ### Changes
          - Integrated ClearSword exploit (CVE-2025-43520)
          - Added iOS 18.7.3 support for A12 devices
          - Added "Extended!" subtitle
          
          ### Supported Devices
          - iPhone XS (A12)
          - iPhone XR (A12)
          - iPhone SE 2020 (A13)
          
          ### Supported iOS Versions
          - iOS 15.0 - 26.0.1
          
          ### Building from Source
          1. Download source code
          2. On macOS with Xcode: `make`
          3. Sign and install IPA
        draft: false
        prerelease: false
