name: Build Dopamine Extended

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Setup Xcode
      uses: maximumd/setup-xcode@v1
      with:
        xcode-version: '15.4'
        
    - name: Install dependencies
      run: |
        brew install ldid
        
    - name: Build Dopamine
      run: |
        cd Application
        make clean
        make
        
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: Dopamine-Extended-${{ github.sha }}
        path: Application/build/
        retention-days: 30
